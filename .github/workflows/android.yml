name: Build Android APK

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0"'

      - name: Install locked npm dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile=artifacts/unit-test-results.json

      - name: Build production frontend
        run: npm run build

      - name: Bundle offline app assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -a dist/. android/app/src/main/assets/www/

      - name: Build and lint Android app
        working-directory: android
        run: bash ./gradlew --no-daemon --console=plain assembleDebug lintDebug

      - name: Package APK and SHA256 checksum
        run: |
          mkdir -p artifacts/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/apk/yixu-wardrobe-1.0.0.apk
          cd artifacts/apk
          sha256sum yixu-wardrobe-1.0.0.apk > yixu-wardrobe-1.0.0.sha256

      - name: Upload installable APK
        id: apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yixu-wardrobe-android
          path: artifacts/apk/
          if-no-files-found: error
          retention-days: 30

      - name: Write download summary
        env:
          APK_ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '## 衣序 Android APK\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '[下载 APK 与校验文件](%s)\n\n' "$APK_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'Commit: `%s`\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '构建类型：可安装的 debug 签名包。\n\nSHA256:\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/apk/yixu-wardrobe-1.0.0.sha256 >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and Android lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build-reports
          path: |
            artifacts/unit-test-results.json
            android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
